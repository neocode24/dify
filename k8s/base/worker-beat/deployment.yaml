---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-beat
  namespace: dify
  labels:
    app.kubernetes.io/name: dify
    app.kubernetes.io/component: worker-beat
spec:
  replicas: 1  # Beat는 단일 인스턴스만 필요
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
      app.kubernetes.io/component: worker-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify
        app.kubernetes.io/component: worker-beat
    spec:
      # hostPath PV를 사용하므로 동일 노드에 스케줄링
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - orbstack
      containers:
      - name: worker-beat
        image: langgenius/dify-api:1.9.2
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: dify-env
        env:
        - name: MODE
          value: "beat"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: REDIS_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: SECRET_KEY
        - name: WEAVIATE_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: WEAVIATE_API_KEY
        volumeMounts:
        - name: storage
          mountPath: /app/api/storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dify-app-storage
