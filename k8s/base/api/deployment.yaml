---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dify
  labels:
    app.kubernetes.io/name: dify
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify
        app.kubernetes.io/component: api
    spec:
      # hostPath PV를 사용하므로 동일 노드에 스케줄링
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - orbstack
      initContainers:
      - name: db-migrate
        image: langgenius/dify-api:1.9.2
        imagePullPolicy: IfNotPresent
        command:
        - flask
        - db
        - upgrade
        envFrom:
        - configMapRef:
            name: dify-env
        env:
        - name: MODE
          value: "api"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: REDIS_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: SECRET_KEY
      containers:
      - name: api
        image: langgenius/dify-api:1.9.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5001
          protocol: TCP
        envFrom:
        - configMapRef:
            name: dify-env
        env:
        - name: MODE
          value: "api"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: REDIS_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: SECRET_KEY
        - name: WEAVIATE_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: WEAVIATE_API_KEY
        - name: SANDBOX_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: SANDBOX_API_KEY
        - name: PLUGIN_DAEMON_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_DAEMON_KEY
        volumeMounts:
        - name: storage
          mountPath: /app/api/storage
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dify-app-storage
