---
# RWX용 PVC - hostPath PV와 바인딩
# api, worker, worker-beat가 공유
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dify-app-storage
  namespace: dify
  labels:
    app.kubernetes.io/name: dify
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # Static binding to dify-app-storage-pv
  resources:
    requests:
      storage: 50Gi
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
      app.kubernetes.io/component: storage
