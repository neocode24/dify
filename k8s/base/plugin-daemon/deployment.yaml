---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-daemon
  namespace: dify
  labels:
    app.kubernetes.io/name: dify
    app.kubernetes.io/component: plugin-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dify
      app.kubernetes.io/component: plugin-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify
        app.kubernetes.io/component: plugin-daemon
    spec:
      enableServiceLinks: false  # Disable automatic service environment variables
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - orbstack
      containers:
      - name: plugin-daemon
        image: langgenius/dify-plugin-daemon:0.3.3-local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5002
          protocol: TCP
        - name: debug
          containerPort: 5003
          protocol: TCP
        env:
        # Database Configuration
        - name: DB_TYPE
          value: "postgresql"
        - name: DB_HOST
          value: "postgresql"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: DB_PASSWORD
        - name: DB_DEFAULT_DATABASE
          value: "dify_plugin"
        - name: DB_DATABASE
          value: "dify_plugin"

        # Plugin Daemon Configuration (SERVER_KEY is the required variable name)
        - name: SERVER_PORT
          value: "5002"
        - name: SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_DAEMON_KEY
        - name: PLUGIN_DAEMON_PORT
          value: "5002"
        - name: PLUGIN_DEBUGGING_HOST
          value: "0.0.0.0"
        - name: PLUGIN_DEBUGGING_PORT
          value: "5003"
        - name: PLUGIN_REMOTE_INSTALLING_HOST
          value: "0.0.0.0"
        - name: PLUGIN_REMOTE_INSTALLING_PORT
          value: "5003"

        # Dify API Configuration
        - name: DIFY_INNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_DIFY_INNER_API_KEY
        - name: DIFY_INNER_API_URL
          value: "http://api:5001"

        # Redis Configuration
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: REDIS_PASSWORD
        - name: REDIS_DB
          value: "0"
        - name: REDIS_USE_SSL
          value: "false"
        - name: REDIS_URL
          value: "redis://:difyai123456@redis:6379/0"

        # Storage Configuration
        - name: PLUGIN_STORAGE_TYPE
          value: "local"
        - name: PLUGIN_STORAGE_LOCAL_ROOT
          value: "/app/storage"

        # Plugin Settings
        - name: MAX_PLUGIN_PACKAGE_SIZE
          value: "52428800"
        - name: PYTHON_ENV_INIT_TIMEOUT
          value: "120"
        - name: PLUGIN_MAX_EXECUTION_TIMEOUT
          value: "600"
        - name: PLUGIN_STDIO_BUFFER_SIZE
          value: "1024"
        - name: PLUGIN_STDIO_MAX_BUFFER_SIZE
          value: "5242880"
        - name: FORCE_VERIFYING_SIGNATURE
          value: "true"
        - name: PLUGIN_INSTALLED_PATH
          value: "plugin"
        - name: PLUGIN_PACKAGE_CACHE_PATH
          value: "plugin_packages"
        - name: PLUGIN_MEDIA_CACHE_PATH
          value: "assets"
        - name: PLUGIN_WORKING_PATH
          value: "/app/storage/cwd"

        # Logging
        - name: LOG_LEVEL
          value: "INFO"

        volumeMounts:
        - name: storage
          mountPath: /app/storage

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health/check
            port: 5002
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/check
            port: 5002
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: dify-plugin-storage
