---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dify

# Production 환경 설정
patches:
  - path: patches/replicas.yaml
  - patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "INFO"
      - op: replace
        path: /data/DEBUG
        value: "false"
      - op: replace
        path: /data/FLASK_DEBUG
        value: "false"
      - op: replace
        path: /data/ENABLE_REQUEST_LOGGING
        value: "false"
    target:
      kind: ConfigMap
      name: dify-env

labels:
  - pairs:
      environment: production
