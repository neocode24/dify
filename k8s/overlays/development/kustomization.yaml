---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dify

# Development 환경 설정
patches:
  - path: patches/replicas.yaml
  - patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
      - op: replace
        path: /data/DEBUG
        value: "true"
      - op: replace
        path: /data/FLASK_DEBUG
        value: "true"
      - op: replace
        path: /data/ENABLE_REQUEST_LOGGING
        value: "true"
    target:
      kind: ConfigMap
      name: dify-env

# namePrefix 제거 - nginx 설정의 service name과 충돌 방지
# namePrefix: dev-
# nameSuffix: ""

labels:
  - pairs:
      environment: development
